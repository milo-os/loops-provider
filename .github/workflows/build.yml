name: Build and Push Docker Image

on:
  push:
    paths-ignore:
      - "README.md"
      
  pull_request:
    paths-ignore:
      - "README.md"

  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (startsWith(github.ref, 'refs/heads/') && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)) }}

jobs:

  check-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

  validate-kustomize:
    uses: datum-cloud/actions/.github/workflows/validate-kustomize.yaml@v1.24.0

  publish-container-image:
    needs: validate-kustomize
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@v1.24.0
    with:
      registry-organization: milo-os
      image-name: loops-provider
    secrets: inherit

  publish-kustomize-bundles:
    needs: publish-container-image
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@v1.24.0
    with:
      bundle-name: ghcr.io/milo-os/loops-provider-kustomize
      bundle-path: config
      image-overlays: config/base
      image-name: ghcr.io/milo-os/loops-provider
      debug: true
    secrets: inherit
    
